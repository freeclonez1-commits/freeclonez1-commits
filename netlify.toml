[build]
  command = "npm ci --prefix dashboard && npm run build --prefix dashboard"
  publish = "dashboard/dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/api/v1/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/client-tracker.js"
  to = "/.netlify/functions/api/client-tracker.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
